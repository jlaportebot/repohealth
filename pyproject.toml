[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repohealth"
version = "0.2.0"
description = "CLI tool to assess Git repository health — stale branches, uncommitted changes, outdated deps, and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "Jonathan Laporte"}]
keywords = ["git", "health", "cli", "repository", "lint", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = ["click>=8.0", "rich>=13.0", "pyyaml>=6.0"]

[project.scripts]
repohealth = "repohealth.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["repohealth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
